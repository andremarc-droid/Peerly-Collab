name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java (required by Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_USE_EMULATORS: 'false'
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_GROQ_MODEL: ${{ secrets.VITE_GROQ_MODEL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ secrets.VITE_GOOGLE_APP_ID }}

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Configure native Google sign-in
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          EXPECTED_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GOOGLE_SERVICES_JSON GitHub Actions secret. Add the Firebase Android google-services.json for com.peerly.collab."
            exit 1
          fi
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_DEBUG_KEYSTORE_BASE64 GitHub Actions secret. Add the stable Android debug keystore used to register this app's SHA-1 with Firebase."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          ANDROID_SIGNING_SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | awk '/SHA1:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ANDROID_SIGNING_SHA1" ]; then
            echo "Could not read SHA-1 from the configured Android debug keystore. Check ANDROID_DEBUG_KEYSTORE_BASE64."
            exit 1
          fi
          echo "APK debug signing SHA-1: $ANDROID_SIGNING_SHA1"
          export ANDROID_SIGNING_SHA1
          echo "ANDROID_SIGNING_SHA1=$ANDROID_SIGNING_SHA1" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          import os
          import sys

          with open('android/app/google-services.json', encoding='utf-8') as file:
              config = json.load(file)

          project_id = config.get('project_info', {}).get('project_id', '')
          expected_project_id = os.environ.get('EXPECTED_FIREBASE_PROJECT_ID', '')
          package_name = 'com.peerly.collab'
          signing_sha1 = os.environ['ANDROID_SIGNING_SHA1']
          matching_clients = [
              client for client in config.get('client', [])
              if client.get('client_info', {}).get('android_client_info', {}).get('package_name') == package_name
          ]
          matching_android_oauth = any(
              oauth.get('client_type') == 1
              and oauth.get('android_info', {}).get('package_name') == package_name
              and oauth.get('android_info', {}).get('certificate_hash', '').replace(':', '').lower() == signing_sha1
              for client in matching_clients
              for oauth in client.get('oauth_client', [])
          )
          has_web_oauth = any(
              oauth.get('client_type') == 3
              for client in matching_clients
              for oauth in client.get('oauth_client', [])
          )

          print(f"Firebase Android project ID: {project_id or '(missing)'}")
          print(f"Android package configured: {bool(matching_clients)}")
          print(f"Android OAuth client matches CI signing SHA-1: {matching_android_oauth}")
          print(f"Web OAuth client available: {has_web_oauth}")
          if expected_project_id and project_id != expected_project_id:
              print('ERROR: google-services.json and VITE_FIREBASE_PROJECT_ID refer to different Firebase projects.')
              sys.exit(1)
          if not matching_clients:
              print(f'ERROR: google-services.json has no Android client for {package_name}.')
              sys.exit(1)
          if not matching_android_oauth:
              print('ERROR: Add the printed CI signing SHA-1 to this Android app in Firebase, download a fresh google-services.json, and update GOOGLE_SERVICES_JSON.')
              sys.exit(1)
          if not has_web_oauth:
              print('ERROR: google-services.json has no Web OAuth client (client_type 3) for this Android app.')
              sys.exit(1)
          PY
          cat >> android/variables.gradle <<'EOF'

          ext {
            rgcfaIncludeGoogle = true
            androidxCredentialsVersion = '1.3.0'
          }
          EOF

          # Pin the debug signing key explicitly. The build was ignoring ~/.android/debug.keystore and
          # signing with its own key, which Firebase does not know (Google sign-in error 10).
          echo "ANDROID_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          if [ ! -f android/app/build.gradle ]; then
            echo "ERROR: android/app/build.gradle was not found, so the debug signing key cannot be pinned."
            exit 1
          fi
          cat >> android/app/build.gradle <<'EOF'

          // Added by CI: always sign the debug APK with the keystore whose SHA-1 is registered in Firebase.
          android {
            signingConfigs {
              debug {
                storeFile file(System.getenv('ANDROID_DEBUG_KEYSTORE_PATH'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
              }
            }
          }
          EOF

      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Set up Gradle (caches downloads between runs)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify the APK is signed with the key registered in Firebase
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER_OUT="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$APKSIGNER_OUT"
          APK_SHA1="$(echo "$APKSIGNER_OUT" | awk '/certificate SHA-1 digest/{print tolower($NF); exit}' | tr -d ':[:space:]')"
          pretty() { echo "$1" | tr a-f A-F | sed 's/../&:/g;s/:$//'; }
          echo "Package:                      com.peerly.collab"
          echo "SHA-1 registered in Firebase: $(pretty "$ANDROID_SIGNING_SHA1")"
          echo "SHA-1 the APK is signed with: $(pretty "$APK_SHA1")"
          if [ -z "$APK_SHA1" ] || [ "$APK_SHA1" != "$ANDROID_SIGNING_SHA1" ]; then
            echo "ERROR: The APK is not signed with the key whose SHA-1 is registered in Firebase, so native Google sign-in will fail with error 10."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: peerly-collab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
